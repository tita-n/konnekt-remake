title = "Konnekt gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Documented test/CI placeholders and generated local fixtures"
paths = [
  '''^test-results/''',
  '''^playwright-report/''',
  '''^\\.lighthouseci/''',
  '''^perf/current\\.json$''',
  '''^\\.env\\.example$''',
  '''^\\.env\\.e2e\\.example$''',
]
regexes = [
  # Deterministic fixture values used by env/security unit tests.
  '''0123456789abcdef0123456789abcdef''',
  '''ci-only-secret-[A-Za-z0-9]+''',
  '''test-secret-for-konnekt-[A-Za-z0-9-]+''',
  '''KonnektDemo123!''',
  '''KonnektE2E123!''',
  '''1x00000000000000000000AA''',
  '''1x0000000000000000000000000000000AA''',
]
